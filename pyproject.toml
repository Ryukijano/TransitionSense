[project]
name = "transitionsense"
version = "0.1.0"
description = "TransitionSense: postural-transition recognition on UCI HAPT with subject-disjoint evaluation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transitionsense"
module-root = "src"
